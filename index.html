<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 検索エンジンにインデックスされないように設定 -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tool-page</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; background-color: #f9f9f9; }
    h2 { color: #333; margin-bottom: 5px; }
    
    .supported-sites {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input {
      flex-grow: 1;
      max-width: 400px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .paste-btn {
      background-color: #6c757d;
      color: white;
    }
    .paste-btn:hover { background-color: #5a6268; }

    .dl-btn {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }
    .dl-btn:hover { background-color: #0069d9; }
    .dl-btn:disabled { background-color: #a0cfff; cursor: not-allowed; }

    #userLinkArea {
      margin-top: 10px;
      font-size: 15px;
      word-break: break-all;
    }
    #userLinkArea a {
      color: #007bff;
      text-decoration: underline;
      font-weight: bold;
    }

    #status { margin-top: 20px; font-weight: bold; word-break: break-all; min-height: 1.2em; }

    .copy-area {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #copyBtn { display: none; background-color: #f0f0f0; border: 1px solid #ccc; padding: 5px 12px; font-size: 14px; border-radius: 4px; color: #333; }
    #copyNotice { font-size: 13px; color: #28a745; font-weight: bold; }
    
    .version-box { margin-top: 50px; padding-top: 15px; border-top: 1px solid #eee; font-size: 13px; color: #888; }
  </style>
</head>
<body>

  <h2>tool-page</h2>
  <div class="supported-sites">対応サイト: TikTok</div>
  
  <div class="input-group">
    <input type="text" id="videoUrl" placeholder="" />
    <button class="paste-btn" onclick="pasteUrl()" title="クリップボードから貼り付け">貼り付け</button>
    <button class="dl-btn" id="mainDlBtn" onclick="downloadVideo()">実行</button>
  </div>

  <!-- ユーザーのトップページリンク表示場所 -->
  <div id="userLinkArea"></div>

  <!-- ステータス表示エリア -->
  <div id="status"></div>
  
  <div class="copy-area">
    <button id="copyBtn" onclick="copyError()">エラー詳細をコピー</button>
    <span id="copyNotice"></span>
  </div>

  <div class="version-box">
    更新日時: 2026-09-03 15:00
  </div>

  <script>
    let lastErrorMessage = '';

    async function pasteUrl() {
      const inputEl = document.getElementById('videoUrl');
      const statusDiv = document.getElementById('status');
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          inputEl.value = text.trim();
          statusDiv.innerText = 'URLを貼り付けました。';
          setTimeout(() => { if(statusDiv.innerText === 'URLを貼り付けました。') statusDiv.innerText = ''; }, 2000);
        } else {
          statusDiv.innerText = 'クリップボードが空、またはテキストではありません。';
        }
      } catch (err) {
        console.error('Failed to read clipboard: ', err);
        statusDiv.innerText = '貼り付けに失敗しました。';
      }
    }

    function parseTikTokInfo(urlStr) {
      let author = '';
      let videoId = '';
      try {
        const u = new URL(urlStr);
        const matchUser = u.pathname.match(/@([^/]+)/);
        if (matchUser) author = matchUser[1];
        const matchVideo = u.pathname.match(/video\/(\d+)/);
        if (matchVideo) videoId = matchVideo[1];
      } catch (e) {}
      return { author, videoId };
    }

    function showUserLink(authorId) {
      const userLinkArea = document.getElementById('userLinkArea');
      if (!authorId || authorId === 'user') {
        userLinkArea.innerHTML = '';
        return;
      }
      const profileUrl = `https://www.tiktok.com/@${authorId}`;
      userLinkArea.innerHTML = `ユーザーページ: <a href="${profileUrl}" target="_blank" rel="noopener noreferrer">${profileUrl}</a>`;
    }

    async function triggerDirectDownload(fileUrl, fileName) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = '動画ファイルをダウンロード中...';
      try {
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
        statusDiv.innerText = 'ダウンロードが完了しました！';
      } catch (e) {
        statusDiv.innerText = '別タブで動画を開きます。右クリックで保存してください。';
        window.open(fileUrl, '_blank');
      }
    }

    // TikTok処理
    async function handleTikTok(rawUrl) {
      const parsed = parseTikTokInfo(rawUrl);

      try {
        const formData = new FormData();
        formData.append('url', rawUrl);
        formData.append('hd', 1);
        const res = await fetch('https://www.tikwm.com/api/', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.code === 0 && data.data && (data.data.play || data.data.hdplay)) {
          const videoLink = data.data.hdplay || data.data.play;
          const author = (data.data.author && data.data.author.unique_id) || parsed.author || 'user';
          const videoId = data.data.id || parsed.videoId || Date.now();
          const fileName = `${author}(${videoId}) - TikTok.mp4`;
          
          showUserLink(author);
          await triggerDirectDownload(videoLink, fileName);
          return true;
        } else {
          lastErrorMessage = `[TikWM Error] code: ${data.code}, msg: ${data.msg || 'failed'}`;
        }
      } catch (err) {
        lastErrorMessage = `[TikWM Fetch Error] ${err.message}`;
      }
      return false;
    }

    async function downloadVideo() {
      const rawUrl = document.getElementById('videoUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const copyBtn = document.getElementById('copyBtn');
      const copyNotice = document.getElementById('copyNotice');
      const dlBtn = document.getElementById('mainDlBtn');
      const userLinkArea = document.getElementById('userLinkArea');

      statusDiv.innerText = '';
      userLinkArea.innerHTML = '';
      copyBtn.style.display = 'none';
      copyNotice.innerText = '';
      lastErrorMessage = '';

      if (!rawUrl) {
        statusDiv.innerText = 'URLを入力してください。';
        return;
      }

      statusDiv.innerText = '解析中...';
      dlBtn.disabled = true;

      const success = await handleTikTok(rawUrl);

      if (!success) {
        statusDiv.innerText = 'エラー: 動画を取得できませんでした。';
        copyBtn.style.display = 'inline-block';
      }

      dlBtn.disabled = false;
    }

    function copyError() {
      if (!lastErrorMessage) return;
      const copyNotice = document.getElementById('copyNotice');
      navigator.clipboard.writeText(lastErrorMessage).then(() => {
        copyNotice.innerText = 'コピーしました！';
        setTimeout(() => { copyNotice.innerText = ''; }, 2000);
      }).catch(() => {
        copyNotice.innerText = 'コピー失敗';
        setTimeout(() => { copyNotice.innerText = ''; }, 2000);
      });
    }
  </script>
</body>
</html>
